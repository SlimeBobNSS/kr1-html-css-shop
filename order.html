<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Официальное оформление заявок на билеты этапов Формулы-1.">
  <title>Заказ билетов — F1 Hub</title>
  <link rel="stylesheet" href="./css/style.css">
  <script src="./js/main.js" defer></script>
</head>
<body>

  <header class="site-header">
    <div class="site-header__inner">
      <a class="site-header__logo" href="index.html">🏁 F1 Hub</a>
      <nav class="site-nav" aria-label="Основная навигация">
        <ul class="site-nav__list">
          <li class="site-nav__item"><a class="site-nav__link" href="index.html">Главная</a></li>
          <li class="site-nav__item"><a class="site-nav__link" href="catalog.html">База данных</a></li>
          <li class="site-nav__item"><a class="site-nav__link" href="product.html">Болид RB22</a></li>
          <li class="site-nav__item"><a class="site-nav__link site-nav__link--active" href="order.html">Билеты</a></li>
          <li class="site-nav__item"><a class="site-nav__link" href="contacts.html">Контакты</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <div class="section">
      <nav class="breadcrumbs" aria-label="Хлебные крошки">
        <a class="breadcrumbs__link" href="index.html">Главная</a>
        <span class="breadcrumbs__current">Билеты</span>
      </nav>
    </div>

    <section class="section" style="max-width: 600px; margin: 0 auto var(--space-xl);">
      <h1 class="section__title">Оформление заказа билетов</h1>
      
      <form class="product-info" action="#" method="post" style="gap: var(--space-md);">
        <div class="order-form__field">
          <label class="order-form__label" for="page-order-race">Выберите этап Гран-при</label>
          <select class="order-form__input" id="page-order-race" required>
            <option value="singapore">Гран-при Сингапура (9–11 октября 2026)</option>
            <option value="usa">Гран-при США (23–25 октября 2026)</option>
            <option value="mexico">Гран-при Мехико (30 октября – 1 ноября 2026)</option>
          </select>
        </div>

        <div class="order-form__field">
          <label class="order-form__label" for="page-order-zone">Категория трибуны</label>
          <select class="order-form__input" id="page-order-zone" required>
            <option value="grandstand">Главная трибуна (Старт/Финиш)</option>
            <option value="zone1">Повороты 1-3 (Зона высокой скорости)</option>
            <option value="general">Свободное размещение (Без места)</option>
          </select>
        </div>

        <div class="order-form__field">
          <label class="order-form__label" for="page-order-name">Имя и фамилия</label>
          <input class="order-form__input" id="page-order-name" type="text" placeholder="Ваше имя" required>
        </div>

        <div class="order-form__field">
          <label class="order-form__label" for="page-order-email">Электронная почта</label>
          <input class="order-form__input" id="order-email-page" type="email" placeholder="example@mail.ru" required>
        </div>

        <div class="order-form__field form-field--checkbox">
          <label>
            <input type="checkbox" required>
            Я подтверждаю корректность введенных данных
          </label>
        </div>

        <button class="button button--primary" type="submit" style="width: 100%;">Забронировать места 🏎️</button>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <p class="site-footer__copy">&copy; 2026 F1 Drivers & Teams Database. Все права защищены.</p>
  </footer>

</body>
</html>
